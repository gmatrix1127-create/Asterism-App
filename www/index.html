<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F8F6">
  <title>符星</title>
  <link rel="preload" href="fonts/AgibotDisplay-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <section class="screen" id="root">
      <div class="pages">
        <div class="page" data-tab="novel"></div>
        <div class="page" data-tab="world"></div>
        <div class="page" data-tab="notes"></div>
      </div>
      <nav class="tabbar">
        <div class="tab-indicator"></div>
        <button class="tab" data-tab="novel"></button>
        <button class="tab" data-tab="world"></button>
        <button class="tab" data-tab="notes"></button>
      </nav>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
